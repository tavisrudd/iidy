[package]
name = "iidy"
version = "1.0.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
default-run = "iidy"
description = "CloudFormation deployment tool with real-time event streaming, changeset workflow, template approval, and YAML preprocessing"
repository = "https://github.com/tavisrudd/iidy"
homepage = "https://github.com/tavisrudd/iidy"
readme = "README.md"
keywords = ["cloudformation", "aws", "infrastructure-as-code", "yaml", "devops"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
debug-logging = []

[lib]
name = "iidy"
path = "src/lib.rs"

[[bin]]
name = "iidy"
path = "src/main.rs"


[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap_complete = "4.6.11"

# AWS SDKs use the current HTTPS client; omit the legacy rustls/Hyper 0.14 stack.
aws-config = "1.12.0"
aws-sdk-cloudformation = { version = "1.130.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.123.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a", "http-1x"] }
aws-sdk-sns = { version = "1.116.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.128.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1.8.1"

# Date/time handling  
chrono = { version = "0.4.45", features = ["serde"] }

# Regular expressions for YAML post-processing
regex = "1.13.1"


# YAML parsing
serde = { version = "1.0.229", features = ["derive"] }
# Maintained YAML implementations, aliased to preserve the existing API names.
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
serde_json = "1.0.151"
# JSON Schema validation for custom resource template $params
jsonschema = "0.58.5"
# YAML emitter with formatting control
yaml-rust = { package = "yaml-rust2", version = "0.13.0" }

# JMESPath for JSON query filtering
jmespath = "0.5.0"

# Diff generation for template approval
similar = "3.2.0"

# Tree-sitter for precise YAML location tracking
tree-sitter = "0.27.0"
tree-sitter-yaml = "0.7.2"

# Error handling utilities
anyhow = "1.0.104"
thiserror = "2.0.21"

# Tokio runtime required by AWS SDK
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "process", "net"] }
aws-types = "1.6.0"
aws-credential-types = "1.3.0"
# Import preprocessing dependencies
handlebars = "6.4.4"
reqwest = { version = "0.13.5", features = ["json"] }
sha2 = "0.11.0"
url = "2.5.8"
urlencoding = "2.1.3"
async-trait = "0.1.92"
base64 = "0.23.1"
hex = "0.4.3"
rand = "0.10.3"
uuid = { version = "1.27.0", features = ["v4"] }
smallvec = "1.16.2"
heck = "0.5.0"
walkdir = "2.5.0"

# Timing/NTP support
sntpc = { version = "0.11.0", features = ["std"] }
sntpc-net-tokio = "1.3.0"

# Terminal output and color theming
owo-colors = "4.4.0"
anstyle = "1.0.14"
indicatif = "0.18.6"
textwrap = "0.16.4"
ratatui = "0.30.2"

# Utilities for demo feature
tempfile = "3.27.0"
terminal_size = "0.4.4"
crossterm = "0.29.0"
log = "0.4.34"
env_logger = "0.11.11"
portable-pty = "0.9.0"
once_cell = "1.21.4"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
# Testing and mocking
mockito = "1.7.2"
tokio-test = "0.4.6"

# Property-based testing
proptest = "1.11.0"

# Snapshot testing
insta = { version = "1.49.0", features = ["yaml"] }

# Benchmarking
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "yaml_preprocessing_benchmarks"
harness = false

[[bench]]
name = "simple_benchmark"
harness = false

[[bench]]
name = "parsing_optimization_benchmark"
harness = false
